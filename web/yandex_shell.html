<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
        html, body, #canvas { margin: 0; padding: 0; border: 0; }
        html, body { width: 100%; height: 100%; }
        body {
            color: white;
            background-color: #101522;
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* This image is outer Web chrome, never a Godot scene asset. */
        @media (min-aspect-ratio: 1 / 1) {
            body {
                background-image: url("desktop_backdrop.png");
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
            }
        }
        #game-shell {
            flex: 0 0 auto;
            position: relative;
            width: min(100vw, calc(100vh * 9 / 16));
            height: min(100vh, calc(100vw * 16 / 9));
        }
        #canvas { display: block; position: relative; z-index: 1; width: 100%; height: 100%; }
        #canvas:focus { outline: none; }
        #status, #status-splash, #status-progress { position: absolute; left: 0; right: 0; }
        #status, #status-splash { top: 0; bottom: 0; }
        #status {
            background-color: #242424;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            z-index: 2;
        }
        #status-splash { max-height: 100%; max-width: 100%; margin: auto; }
        #status-splash.show-image--false { display: none; }
        #status-splash.fullsize--true { height: 100%; width: 100%; object-fit: contain; }
        #status-splash.use-filter--false { image-rendering: pixelated; }
        #status-progress, #status-notice { display: none; }
        #status-progress { bottom: 10%; width: 50%; margin: 0 auto; }
        #status-notice {
            background-color: #5b3943;
            border-radius: 0.5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            z-index: 2;
        }
    </style>
    $GODOT_HEAD_INCLUDE
</head>
<body>
    <div id="game-shell">
        <canvas id="canvas" width="720" height="1280">Your browser does not support the canvas tag.</canvas>
        <div id="status">
            <img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
            <progress id="status-progress"></progress>
            <div id="status-notice"></div>
        </div>
    </div>
    <noscript>JavaScript is required to run this game.</noscript>
    <script src="$GODOT_URL"></script>
    <script>
        const GODOT_CONFIG = $GODOT_CONFIG;
        GODOT_CONFIG.canvas = document.getElementById("canvas");
        GODOT_CONFIG.canvasResizePolicy = 0;
        const engine = new Engine(GODOT_CONFIG);
        const statusOverlay = document.getElementById("status");
        const statusProgress = document.getElementById("status-progress");
        const statusNotice = document.getElementById("status-notice");
        function setStatusMode(mode) {
            if (mode === "hidden") { statusOverlay.remove(); return; }
            statusOverlay.style.visibility = "visible";
            statusProgress.style.display = mode === "progress" ? "block" : "none";
            statusNotice.style.display = mode === "notice" ? "block" : "none";
        }
        function showFailure(error) {
            console.error(error);
            statusNotice.textContent = error instanceof Error ? error.message : String(error);
            setStatusMode("notice");
        }
        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length !== 0) {
            showFailure("Error: " + missing.join(", "));
        } else {
            setStatusMode("progress");
            engine.startGame({
                onProgress: function (current, total) {
                    if (current > 0 && total > 0) {
                        statusProgress.value = current;
                        statusProgress.max = total;
                    } else {
                        statusProgress.removeAttribute("value");
                        statusProgress.removeAttribute("max");
                    }
                },
            }).then(function () { setStatusMode("hidden"); }, showFailure);
        }
    </script>
</body>
</html>
